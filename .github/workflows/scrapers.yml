name: Scrapers CI²A²

# Corre los tres scrapers cada día a las 06:00 UTC (03:00 en Chile) y se
# puede lanzar a mano desde la pestaña Actions ("Run workflow").
#
# Cada scraper es un job independiente: si uno falla (por ejemplo, el sitio
# de la UFRO no responde desde los servidores de GitHub), los otros igual
# se ejecutan. El job que falla sigue marcándose en rojo y GitHub avisa.
#
# Los jobs usan una versión fija de Ubuntu (ubuntu-24.04) en vez de
# ubuntu-latest, para que un cambio de versión de GitHub no altere el entorno
# de los scrapers sin que nos demos cuenta. Al subir de versión, se cambia
# aquí a propósito y se prueba con "Run workflow".
on:
  schedule:
    # Todos los días a las 06:00 UTC (~03:00 Chile continental).
    # OpenAlex y ORCID son APIs reales sin límites agresivos, así que no
    # necesitan un cron aparte más espaciado (a diferencia de lo que hacía
    # falta con Google Scholar, que se descartó por bloquear las requests
    # automatizadas — ver notas en openAlex.js).
    - cron: '0 6 * * *'
  workflow_dispatch: {} # permite correrlo manualmente desde GitHub

permissions:
  contents: read

jobs:
  orcid:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run scrape:orcid
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  openalex:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run scrape:openalex
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  noticias:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run scrape:noticias
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}